<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Spoor Partner Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <meta name="theme-color" content="#FAF5F0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#17052D" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Geist:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Sign in -->
  <main id="login" class="login" hidden>
    <div class="login-card">
      <div class="brand brand-lg"><span class="logo-chip"><img class="logo" src="assets/spoor-logo.svg" alt="Spoor" width="126" height="28"></span><span class="brand-sub">Partner Portal</span></div>
      <h1>Welcome, partner</h1>
      <p class="muted">Enter the access code you received from the Spoor partner team.</p>
      <form id="login-form" autocomplete="off">
        <label for="code">Access code</label>
        <input id="code" name="code" type="text" required spellcheck="false" autocapitalize="characters">
        <p id="login-error" class="error" role="alert" hidden>That code was not recognised. Check it and try again.</p>
        <button type="submit" class="btn btn-primary">Sign in<span class="btn-target" aria-hidden="true"><svg viewBox="0 0 28 28" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 8V1h7M20 1h7v7M27 20v7h-7M8 27H1v-7"/><path d="M7 14h14M16 9l5 5-5 5"/></svg></span></button>
      </form>
      <p class="muted small">No code yet? Email <a id="login-contact" href="#"></a></p>
    </div>
  </main>

  <!-- Portal -->
  <div id="app" hidden>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="#/why"><span class="logo-chip"><img class="logo" src="assets/spoor-logo.svg" alt="Spoor" width="126" height="28"></span><span class="brand-sub">Partner Portal</span></a>
        <div class="topbar-right">
          <button id="logout" class="btn btn-soft btn-sm">Sign out<span class="btn-target" aria-hidden="true"><svg viewBox="0 0 28 28" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 8V1h7M20 1h7v7M27 20v7h-7M8 27H1v-7"/><path d="M7 14h14M16 9l5 5-5 5"/></svg></span></button>
        </div>
      </div>
      <nav id="nav" class="nav" aria-label="Sections"></nav>
    </header>
    <main id="content" class="content"></main>
    <footer class="footer">Spoor partner material. For use in partner bids and proposals only.</footer>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
